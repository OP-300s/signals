const SG=[['core','Core indicators','Different for each market: EMA, MACD, RSI, Bollinger, volume'],['sr','Support & resistance','Price levels that stopped price several times'],['sd','Supply & demand','Zones where price was pushed hard before'],['lq','Liquidity sweep','Price grabs stop orders past a swing high or low, then reverses'],['cp','Candlestick patterns','Engulfing and pin bars, counted only at support or resistance']];

const p=n=>{const d=Math.abs(n)<10?5:2;return n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})};
const ema=(a,n)=>{const k=2/(n+1);let q=a[0];return a.map((v,i)=>i?(q=v*k+q*(1-k)):v)};

function atr(x,n=14){const r=[];let a=0;x.forEach((k,i)=>{const t=i?Math.max(k.h-k.l,Math.abs(k.h-x[i-1].c),Math.abs(k.l-x[i-1].c)):k.h-k.l;a=i<n?(a*i+t)/(i+1):(a*(n-1)+t)/n;r.push(a)});return r}
function pivots(x,L=3){const H=[],O=[];for(let j=L;j<x.length-L;j++){let u=1,d=1;for(let m=j-L;m<=j+L;m++){if(x[m].h>x[j].h)u=0;if(x[m].l<x[j].l)d=0}if(u)H.push([j,x[j].h]);if(d)O.push([j,x[j].l])}return[H,O]}
function levels(P,A){const all=[...P[0],...P[1]].map(a=>a[1]).sort((a,b)=>a-b),cl=[];all.forEach(v=>{const c=cl[cl.length-1];if(c&&v-c.m<=.6*A){c.s+=v;c.n++;c.m=c.s/c.n}else cl.push({s:v,n:1,m:v})});return cl.filter(c=>c.n>=2).map(c=>({p:c.m,n:c.n}))}
function zones(x,A){const Z=[];for(let j=Math.max(1,x.length-150);j<x.length-2;j++){const a=x[j],n=x[j+1];if(Math.abs(n.c-n.o)<1.5*A)continue;

return Z.filter(z=>x.slice(z.j+2).every(k=>z.t==='D'?k.c>z.lo:k.c<z.hi))}

function analyze(k,x,bx){

v.forEach((a,j)=>{const xx=X(s+j),cl=C(a.c>=a.o?'--g':'--r');g.strokeStyle=cl;g.fillStyle=cl;g.lineWidth=2;g.beginPath();g.moveTo(xx,Y(a.h));g.lineTo(xx,Y(a.l));g.stroke();g.fillRect(xx-w*.35,Y(Math.max(a.o,a.c)),w*.7,Math.max(2,Math.abs(Y(a.o)-Y(a.c))))});

function render(k,x,bx){

chart(x,r.ov);
$('#st').textContent='Updated '+new Date().toLocaleTimeString()+'. Signals use closed candles, so they change at most once per '+({'15m':'15 minutes','1h':'hour','4h':'4 hours'}[tf])+'.'+(M.note?' '+M.note:'')}
async function load(){const my=++tok;$('#st').textContent='Updating...';$('#rf').disabled=true;$('#rf').textContent='Refreshing...';
try{const x=await candles(cur,tf),b=cur==='ETH'?await candles('BTC',tf):null;if(my===tok)render(cur,x,b)}
catch(e){if(my===tok)$('#st').textContent='Could not update: '+e.message+'. Check your connection, then tap Refresh.'}
finally{if(my===tok){$('#rf').disabled=false;$('#rf').textContent='Refresh'}}}
function sel(){document.querySelectorAll('[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tf))}
$('#mk').innerHTML=Object.keys(MK).map(k=>`<button data-k="${k}">${MK[k].n}</button>`).join('');
$('#tfs').innerHTML=['15m','1h','4h'].map(t=>`<button data-t="${t}">${t}</button>`).join('');
$('#sl').innerHTML=SG.map(a=>`<label class="ck"><input type="checkbox" value="${a[0]}"${ST.includes(a[0])?' checked':''}><span><b>${a[1]}</b><br><span class="mu small">${a[2]}</span></span></label>`).join('');
$('#sl').onchange=()=>{ST=[...document.querySelectorAll('#sl input:checked')].map(c=>c.value);ls('sg',ST.join(','));if(last)render(...last)};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!(b.dataset.k||b.dataset.t))return;if(b.dataset.k)cur=b.dataset.k;if(b.dataset.t)tf=b.dataset.t;sel();$('#out').innerHTML='';load()});
const setTh=t=>{document.documentElement.dataset.theme=t;ls('th',t);$('#th').textContent=t==='dark'?'Light mode':'Dark mode'};
$('#th').onclick=()=>{setTh(document.documentElement.dataset.theme==='dark'?'light':'dark');if(last)render(...last)};
$('#rf').onclick=load;
setTh(ls('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
setInterval(()=>{if(!document.hidden)load()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});sel();load();
</script></body></html>
